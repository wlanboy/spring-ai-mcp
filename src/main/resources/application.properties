spring.application.name=helloworld
spring.ai.mcp.server.name=hello-world-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS

# --- Server ---
server.port=8080
server.shutdown=graceful

# --- Tomcat: schlank gehalten, da dieser MCP-Server nur wenige gleichzeitige
# AI-Client-Verbindungen bedient, keine hochfrequente Web-API ist.
# server.tomcat.threads.max=200 (Default)
server.tomcat.threads.max=20
# server.tomcat.max-connections=8192 (Default)
server.tomcat.max-connections=512
# Anzahl der Requests, die in die Warteschlange duerfen, bevor Verbindungen abgelehnt werden
server.tomcat.accept-count=100
# Bei threads.max=20 reichen wenige Idle-Threads (Default: 10)
server.tomcat.threads.min-spare=5

# --- Timeouts: kurz halten, damit offene Keep-Alive-Verbindungen den graceful shutdown
# nicht unnoetig verzoegern
# server.tomcat.connection-timeout=20s (Default)
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=15s

# --- Falls der Server hinter einem Reverse Proxy/Ingress laeuft: X-Forwarded-* Header
# vom Spring-Framework auswerten lassen, damit Client-IP/Schema/Host in Logs und
# generierten URLs korrekt ankommen
server.forward-headers-strategy=framework

# --- JMX-Registrierung der Tomcat-MBeans abschalten: spart etwas Startzeit/Speicher,
# da kein JMX-Monitoring genutzt wird
server.tomcat.mbeanregistry.enabled=false

# --- Graceful shutdown: Zeitfenster, in dem laufende Requests beim Herunterfahren
# des Containers noch abgeschlossen werden duerfen
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Actuator: fuer Health-Checks (z.B. Docker HEALTHCHECK oder spaetere
# Kubernetes Liveness-/Readiness-Probes) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
