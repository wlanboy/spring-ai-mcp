spring.application.name=helloworld
spring.ai.mcp.server.name=hello-world-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS

# --- Server ---
server.port=8080
server.shutdown=graceful

# --- Jetty: schlank gehalten, da dieser MCP-Server nur wenige gleichzeitige
# AI-Client-Verbindungen bedient, keine hochfrequente Web-API ist.
server.jetty.threads.max=20
server.jetty.max-connections=512
# Timeouts: kurz halten, damit offene Keep-Alive-Verbindungen den graceful shutdown
# nicht unnoetig verzoegern
server.jetty.connection-idle-timeout=15s

# --- Falls der Server hinter einem Reverse Proxy/Ingress laeuft: X-Forwarded-* Header
# vom Spring-Framework auswerten lassen, damit Client-IP/Schema/Host in Logs und
# generierten URLs korrekt ankommen
server.forward-headers-strategy=framework

# --- Graceful shutdown: Zeitfenster, in dem laufende Requests beim Herunterfahren
# der Anwendung noch abgeschlossen werden duerfen
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Actuator: fuer Health-Checks (z.B. Kubernetes
# Liveness-/Readiness-Probes) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
